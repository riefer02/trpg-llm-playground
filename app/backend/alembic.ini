# Alembic configuration file for Lancer backend

[alembic]
# Path to migration scripts
script_location = db/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# having a source .py file present
# sourceless = false

# Version location specification
# version_locations = %(here)s/bar:%(here)s/bat:db/migrations/versions

# Version path separator
# version_path_separator = os

# Output encoding used when revision files are written
output_encoding = utf-8

# Database URL (will be overridden by config.py)
sqlalchemy.url = postgresql://lancer:lancer@localhost:5433/lancer

[post_write_hooks]
# Post-write hooks - format with ruff
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
