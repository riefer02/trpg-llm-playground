# Lancer RPG Fine-tuning Configuration

project_name: "lancer" # Change this to match your synthetic config
dataset_tag: "combined" # Using merged general + walkthrough dataset

model:
  # Model Selection (7-8B recommended for local deployment)
  # - Qwen2.5-7B: Best quality, great instruction following
  # - Llama-3.1-8B: Strong reasoning, good community support
  # - 32B models require A100/H100 and are overkill for rules QA
  #
  # Training: 7B fits on free Colab T4 (16GB VRAM)
  # Inference: Runs on RTX 3060+, M1 Mac, most gaming PCs
  base_model: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"

  # Max sequence length for training examples
  # - 4096 works well for most RPG Q&A
  # - Reduce to 2048 if you hit OOM errors
  max_seq_length: 4096
  load_in_4bit: true # 4-bit is faster/efficient even on A100

dataset:
  # Use the persistent Drive path
  train_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}.jsonl"
  val_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_val.jsonl" # Optional

training:
  # Save the output directly to Drive
  output_dir: "/content/drive/MyDrive/llm_experiments/outputs/{project_name}_{dataset_tag}_lora"

  # Set to "wandb" to track loss curves (run `wandb login` first)
  report_to: "none"

  # ==========================================================================
  # MEMORY SETTINGS - Adjust based on your GPU
  # ==========================================================================
  # Effective batch size = per_device_batch * gradient_accumulation * num_gpus
  # Keep effective batch ~16 for good convergence
  #
  # GPU Memory Guide:
  #   T4 (16GB):  batch=2, grad_accum=8  (may need max_seq_length=2048)
  #   A100 (40GB): batch=4, grad_accum=4  (safe default)
  #   A100 (80GB): batch=8, grad_accum=2  (faster)
  #
  # If you hit OOM errors:
  #   1. Reduce per_device_train_batch_size
  #   2. Increase gradient_accumulation_steps to compensate
  #   3. Reduce max_seq_length (in model section)
  #   4. Reduce lora.r (in lora section)
  # ==========================================================================
  per_device_train_batch_size: 4 # Safe for A100 40GB with 7B model
  gradient_accumulation_steps: 4 # Effective batch = 4*4 = 16

  warmup_steps: 10
  # Training steps - aim for 2-3 epochs over your dataset
  # Formula: steps = (dataset_size / effective_batch_size) * epochs
  # Example: 1600 samples / 16 batch * 3 epochs = 300 steps
  # More steps = better learning, but diminishing returns after 3-4 epochs
  max_steps: 300 # ~30-45 min on A100 for 1600 samples (3 epochs)
  learning_rate: 2.0e-4
  logging_steps: 5
  save_steps: 25 # Checkpoint every 25 steps
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  seed: 3407

lora:
  # LoRA rank affects quality vs memory tradeoff
  # Higher rank = more expressive but uses more VRAM
  #   T4: r=16, lora_alpha=16
  #   A100: r=32, lora_alpha=32
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  bias: "none"
  use_gradient_checkpointing: "unsloth" # Critical for memory efficiency
  random_state: 3407
  use_rslora: false
  loftq_config: null
