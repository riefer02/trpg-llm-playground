# Lancer RPG Fine-tuning Configuration

project_name: "lancer" # Change this to match your synthetic config
dataset_tag: "combined" # Using merged general + walkthrough dataset

model:
  # Model Selection (7-8B recommended for local deployment)
  # - Qwen2.5-7B: Best quality, great instruction following
  # - Llama-3.1-8B: Strong reasoning, good community support
  # - 32B models require A100/H100 and are overkill for rules QA
  #
  # Training: 7B fits on free Colab T4 (16GB VRAM)
  # Inference: Runs on RTX 3060+, M1 Mac, most gaming PCs
  base_model: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"

  # A100/H100 specific: You can increase this significantly (e.g., 4096, 8192)
  max_seq_length: 4096
  load_in_4bit: true # Even on A100, 4-bit is faster/efficient, but you can turn this false for 16-bit full precision

dataset:
  # Use the persistent Drive path
  train_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}.jsonl"
  val_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_val.jsonl" # Optional

training:
  # Save the output directly to Drive
  output_dir: "/content/drive/MyDrive/llm_experiments/outputs/{project_name}_{dataset_tag}_lora"

  # Professional Tip: Set this to "wandb" to track loss curves in the cloud!
  # You'll need to run `wandb login` in Colab first.
  report_to: "none"

  # A100 Optimized Settings (40GB VRAM)
  # - Batch 8 x grad_accum 2 = effective batch 16
  # - ~10-15 min for 500 samples with 7B model
  # - For T4 (16GB), reduce to batch_size: 4
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2

  warmup_steps: 10
  max_steps: 100 # More steps for better convergence, still fast on A100
  learning_rate: 2.0e-4
  logging_steps: 5
  save_steps: 25 # Checkpoint every 25 steps
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "cosine" # Cosine often works better than linear
  seed: 3407

lora:
  # A100: Can afford higher rank for better quality
  # r=32 gives more expressiveness without much slowdown
  # For T4, reduce to r=16, lora_alpha=16
  r: 32
  lora_alpha: 32
  lora_dropout: 0
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  use_rslora: false
  loftq_config: null
