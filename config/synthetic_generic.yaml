# Synthetic Data Generation Configuration

project_name: "lancer" # Change this for different RPGs (e.g., "dnd5e", "cyberpunk")
dataset_tag: "v1_ctx4096" # Label for compatibility (Version + Max Context)

ingest:
  # Path to your Source Book PDF on Google Drive
  pdf_path: "/content/drive/MyDrive/Books/Lancer Core Book (PR2).pdf"
  # Where to save the intermediate raw text JSONL (Drive recommended)
  raw_output_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_raw.jsonl"
  output_format: "jsonl"
  flush_every: 50

topic: "Lancer RPG Core Rules"
depth: "deep"
n_samples: 50

debug:
  enabled: false
  max_pages: 5
  max_samples: 10

limits:
  enforce_max_samples: true

generation:
  shuffle: true
  shuffle_seed: 1337

resume:
  enabled: true
  checkpoint_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_resume.json"
  allow_mismatch: false
  force_restart: false

task_types:
  - "rules_qa"
  - "character_build"
  - "scenario_seed"
  - "gm_guidance"
  - "lore"

styles:
  - "instructional"
  - "scenario_based"
  - "faq"

output:
  # Path in the Colab environment (dynamically mapped to Drive)
  path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_synthetic_{run_id}.jsonl"
  run_id: "auto"
  append: false
  flush_every: 50

llm:
  model: "gpt-5-mini" # Model for synthetic generation
  temperature: null # Leave null for models that only support defaults
  max_output_tokens: null # Preferred for Responses API
  max_completion_tokens: null # Optional cap for response length
  repair_invalid_json: true
  invalid_response_log: "/content/drive/MyDrive/llm_experiments/datasets/invalid_synth_responses.log"

logging:
  quiet: false
  max_warnings: 10
  hud_every: 10
