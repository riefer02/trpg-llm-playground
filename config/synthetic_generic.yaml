# Synthetic Data Generation Configuration

project_name: "lancer" # Change this for different RPGs (e.g., "dnd5e", "cyberpunk")
dataset_tag: "v2_ctx4096" # Label for compatibility (Version + Max Context)

ingest:
  # Path to your Source Book PDF on Google Drive
  pdf_path: "/content/drive/MyDrive/Books/Lancer Core Book (PR2).pdf"
  # Where to save the intermediate raw text JSONL (Drive recommended)
  raw_output_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_raw.jsonl"
  output_format: "jsonl"
  flush_every: 50

topic: "Lancer RPG Core Rules"
depth: "deep"
n_samples: 50

debug:
  enabled: false
  max_pages: 5
  max_samples: 10

limits:
  enforce_max_samples: false

generation:
  shuffle: true
  shuffle_seed: 1337

context:
  prev_chars: 400
  next_chars: 400

tables:
  enabled: true
  min_rows: 4
  min_cols: 2
  max_rows: 12
  max_cols: 5
  max_pairs: 5
  task_type: "rules_qa"

coverage:
  enabled: true
  min_text_len: 1400
  max_pairs: 2
  task_type: "rules_qa"

rag_mode:
  enabled: true
  emit_messages: true
  citation_style: "(p. {page})"
  format_by_task_type:
    rules_qa: |
      Answer: 1-3 sentences.
      Rules Reference:
      - Bullet list with citations.
      Example: short, practical example.
      Citations: (p. X)
    character_build: |
      Assumptions: short list.
      Recommendations: ranked bullets.
      Tradeoffs: 1-3 bullets.
      Next Questions: 1-2 clarifying questions.
      Citations: (p. X) only when referencing mechanics.
    scenario_seed: |
      Scenario Summary: 2-4 sentences.
      Hooks: 2-3 bullets.
      Obstacles: 2-3 bullets.
      Adjustments: easy/hard variants.
      Citations: (p. X) if mechanics are referenced.
    gm_guidance: |
      Guidance: 3-5 bullets.
      Table Safety/Clarifications: 1-2 bullets if relevant.
      Citations: (p. X) for any rule references.
    lore: |
      Answer: 2-4 sentences.
      Key Facts: 2-4 bullets.
      Citations: (p. X)

# Optional: RAG ingestion artifacts (heading-aware, overlapping chunks with stable IDs).
# This is intentionally separate from rag_mode (which controls synthetic record formatting).
rag_ingest:
  enabled: true
  # Writes chunk JSONL that can be used by synthetic generation and later retrieval.
  chunks_output_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_chunks.jsonl"
  # If true, chunker prepends a short section header to chunk text for better retrieval.
  include_section_prefix: true
  chunking:
    max_tokens: 900
    overlap_tokens: 150
    min_chunk_tokens: 200
  heading_detection:
    # Heading if font size >= (body_font_size + min_size_delta)
    min_size_delta: 1.5
    # Map heading size above body to hierarchical level.
    # Example: >= body+4 => level 1, >= body+2 => level 2, else level 3.
    level_deltas: [4.0, 2.0]
    # Ignore headings that are too long (often body text artifacts).
    max_heading_words: 14

# Optional: RAG index (FAISS) built from rag_ingest chunks.
rag_index:
  enabled: false
  embedding:
    provider: "openai"
    model: "text-embedding-3-small"
    batch_size: 64
  faiss:
    index_output_dir: "/content/drive/MyDrive/llm_experiments/indexes/{project_name}_{dataset_tag}"

resume:
  enabled: true
  checkpoint_path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_resume.json"
  allow_mismatch: false
  force_restart: false

task_types:
  - "rules_qa"
  - "character_build"
  - "scenario_seed"
  - "gm_guidance"
  - "lore"

styles:
  - "instructional"
  - "scenario_based"
  - "faq"

output:
  # Path in the Colab environment (dynamically mapped to Drive)
  path: "/content/drive/MyDrive/llm_experiments/datasets/{project_name}_{dataset_tag}_synthetic_{run_id}.jsonl"
  run_id: "auto"
  append: false
  flush_every: 50

llm:
  model: "gpt-5-mini" # Model for synthetic generation
  temperature: null # Leave null for models that only support defaults
  max_output_tokens: null # Preferred for Responses API
  max_completion_tokens: null # Optional cap for response length
  repair_invalid_json: true
  invalid_response_log: "/content/drive/MyDrive/llm_experiments/datasets/invalid_synth_responses.log"

logging:
  quiet: false
  max_warnings: 10
  hud_every: 10

# ============================================================================
# QUALITY ENHANCEMENTS (P0/P1)
# ============================================================================

# Configurable prompt templates - override defaults from synth_prompts.py
# Use {topic} placeholder which gets replaced with the 'topic' field above
prompts:
  # Override system persona (default uses topic)
  # system_persona: "You are an expert Game Master for {topic}."
  # Override context introduction
  # context_intro: "Read the following text from the {topic} source material:"

# Negative example generation - trains model to say "Not found in context"
negatives:
  enabled: true
  # Target ratio of negative examples in final dataset
  ratio: 0.12
  # Maximum negative examples per chunk
  max_per_chunk: 2
  # Default task type for negatives (or "auto" to match chunk's task type)
  task_type: "rules_qa"

# Answer verification - LLM-based quality scoring and correction
verification:
  enabled: true
  # Minimum score (1-5) to keep a Q/A pair
  threshold: 4
  # If true, use corrected answers for pairs scoring below threshold
  use_corrections: true
  # Model to use for verification (can differ from generation model)
  # model: "gpt-4o-mini"  # Uncomment to use a different model

# Semantic deduplication - removes similar questions
deduplication:
  enabled: true
  # Cosine similarity threshold (0-1, higher = stricter)
  similarity_threshold: 0.85
  # Sentence transformer model for embeddings
  model: "all-MiniLM-L6-v2"
  # Run deduplication across entire dataset (true) or per-chunk (false)
  cross_chunk: true

# ============================================================================
# DIVERSITY ENHANCEMENTS (P2)
# ============================================================================

# Multi-turn conversation generation
# Generates realistic 2-4 turn conversations with follow-ups
multiturn:
  enabled: true
  # Target ratio of multi-turn conversations in dataset
  ratio: 0.20
  # Turn count range (each turn = 1 user + 1 assistant message)
  min_turns: 2
  max_turns: 3
  # Which task types to generate multi-turn for (null = all)
  task_types:
    - "rules_qa"
    - "character_build"
    - "gm_guidance"

# Difficulty stratification
# Ensures diverse cognitive complexity in generated questions
difficulty:
  enabled: true
  # Distribution of difficulty levels (should sum to ~1.0)
  distribution:
    basic: 0.30 # Direct factual recall
    intermediate: 0.50 # Synthesis and comparison
    advanced: 0.20 # Edge cases, complex reasoning
  # Optional: Task-specific overrides
  overrides:
    lore:
      basic: 0.50
      intermediate: 0.40
      advanced: 0.10
    character_build:
      basic: 0.20
      intermediate: 0.50
      advanced: 0.30
